appId: com.futurepal.app
productName: FuturePal
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
win:
  # Instalador (NSIS): é o único formato do Windows que se atualiza sozinho.
  # O "publish" (para onde vão as versões novas) é passado pelo scripts/release.mjs a partir do release.config.json.
  target: nsis
  icon: build/icon.png
  artifactName: FuturePal-Setup-${version}.${ext}
# Onde as apps instaladas procuram versões novas: o repositório público das releases.
# (Sem isto, o electron-builder usava o remote do git, que é privado, e as apps nunca viam as atualizações.)
publish:
  provider: github
  owner: therealsyk
  repo: futurepal
  releaseType: release
# Liga futurepal:// à app (volta do login com Google/Facebook/Apple).
protocols:
  - name: FuturePal
    schemes:
      - futurepal
nsis:
  include: build/installer.nsh
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
